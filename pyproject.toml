[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uUR"
version = "0.1.0"
description = "Native BC-UR (Uniform Resources) encoder/decoder for CPython — companion to the MicroPython uUR module."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-2-Clause-Patent" }

# The C extension itself is declared in setup.py.

[tool.setuptools]
# `src/` holds C sources, not a Python package. Disable auto-discovery, which
# would treat it as a src-layout root, misplace the built extension and break
# the wheel build.
py-modules = []
